services:
  postgres:
    image: postgres:17-alpine
    container_name: nova-security-postgres-local
    environment:
      POSTGRES_USER: nova_security_local
      POSTGRES_PASSWORD: nova_security_local
      POSTGRES_DB: nova_security_local
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova_security_local -d nova_security_local"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - nova-security-postgres-local:/var/lib/postgresql/data
volumes:
  nova-security-postgres-local:
