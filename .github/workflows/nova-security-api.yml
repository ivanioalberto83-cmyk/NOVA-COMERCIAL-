name: NOVA Security API

on:
  push:
    branches:
      - feature/nova-security-foundation-design
    paths:
      - 'apps/security-api/**'
      - '.github/workflows/nova-security-api.yml'
  pull_request:
    paths:
      - 'apps/security-api/**'
      - '.github/workflows/nova-security-api.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/security-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:e2e
      - run: npm run test -- --passWithNoTests
      - run: npm run build
