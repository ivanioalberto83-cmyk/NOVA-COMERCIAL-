name: NOVA Security API

on:
  push:
    branches:
      - feature/nova-security-foundation-design
    paths:
      - 'apps/security-api/**'
      - '.github/workflows/nova-security-api.yml'
  pull_request:
    paths:
      - 'apps/security-api/**'
      - '.github/workflows/nova-security-api.yml'

concurrency:
  group: nova-security-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/security-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/security-api/package-lock.json
      - name: Generate and commit reproducible dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/nova-security-foundation-design'
        run: |
          npm install --package-lock-only --ignore-scripts
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(security): refresh reproducible dependency lockfile"
            git push origin HEAD:feature/nova-security-foundation-design
          else
            echo "package-lock.json already up to date"
          fi
      - name: Install exact locked dependencies
        run: npm ci
      - name: Generate dependency audit report
        if: always()
        run: npm audit --json > npm-audit.json || true
      - name: Generate CycloneDX software bill of materials
        if: always()
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Upload dependency audit and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-security-supply-chain-evidence
          path: |
            apps/security-api/npm-audit.json
            apps/security-api/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce dependency security policy
        run: npm audit --audit-level=low
      - name: Lint
        run: npm run lint
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
