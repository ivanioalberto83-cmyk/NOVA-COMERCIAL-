name: NOVA Security API

on:
  push:
    branches:
      - feature/nova-security-foundation-design
    paths:
      - 'apps/security-api/**'
      - '.github/workflows/nova-security-api.yml'
  pull_request:
    paths:
      - 'apps/security-api/**'
      - '.github/workflows/nova-security-api.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/security-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and commit reproducible dependency lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/nova-security-foundation-design'
        run: |
          npm install --package-lock-only --ignore-scripts
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(security): refresh patched dependency lockfile"
            git push origin HEAD:feature/nova-security-foundation-design
          else
            echo "package-lock.json already up to date"
          fi
      - name: Install exact locked dependencies
        run: npm ci
      - name: Generate dependency audit report
        if: always()
        run: npm audit --json > npm-audit.json || true
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-security-dependency-audit
          path: apps/security-api/npm-audit.json
          if-no-files-found: warn
          retention-days: 14
      - name: Enforce dependency security policy
        run: npm audit --audit-level=low
      - name: Lint
        run: npm run lint
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Unit tests
        run: npm run test -- --passWithNoTests
      - name: Build
        run: npm run build
