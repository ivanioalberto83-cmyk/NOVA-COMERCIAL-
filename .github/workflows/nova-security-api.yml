name: NOVA Security API

on:
  push:
    branches:
      - feature/nova-security-foundation-design
    paths:
      - 'apps/security-api/**'
      - '.github/workflows/nova-security-api.yml'
  pull_request:
    paths:
      - 'apps/security-api/**'
      - '.github/workflows/nova-security-api.yml'

concurrency:
  group: nova-security-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nova_security_test
          POSTGRES_PASSWORD: nova_security_test
          POSTGRES_DB: nova_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nova_security_test -d nova_security_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://nova_security_test:nova_security_test@localhost:5432/nova_security_test?schema=nova_core
      NOVA_ALLOW_DESTRUCTIVE_TEST_DATABASE: 'true'
    defaults:
      run:
        working-directory: apps/security-api
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/security-api/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Create isolated NOVA CORE schema
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE SCHEMA IF NOT EXISTS nova_core;'
      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:migrate:deploy
      - name: Generate dependency audit report
        if: always()
        run: npm audit --json > npm-audit.json || true
      - name: Generate CycloneDX software bill of materials
        if: always()
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json
      - name: Upload dependency audit and SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-security-supply-chain-evidence
          path: |
            apps/security-api/npm-audit.json
            apps/security-api/sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce dependency security policy
        run: npm audit --audit-level=low
      - name: Lint
        run: npm run lint
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Unit tests
        run: npm run test
      - name: Authentication unit tests
        run: npm run test:auth
      - name: PostgreSQL identity and tenant-isolation integration tests
        run: npm run test:integration
      - name: Authentication and refresh-token integration tests
        run: npm run test:auth:integration
      - name: Build
        run: npm run build
